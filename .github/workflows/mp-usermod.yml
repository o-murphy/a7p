name: usermod

# Builds micropython/ compiled directly into firmware via MicroPython's
# User C Modules (USER_C_MODULES), on a representative board per port that
# supports it -- see mp-natmod.yml for the standalone-.mpy build, which covers
# every ARCH natmod/Makefile supports.
#
# Every build step below goes through cibuildmp's own usermod platform
# support (its `feat/usermod` work, landed on top of the v0.3.0 tag this
# project used to pin -- see mp-natmod.yml's own header for the same repin).
# cibuildmp used to drive natmod only; the low-level `build-usermod-*`
# composite actions (`.github/actions/build-usermod-unix`, `-windows`,
# `-webassembly`, `-esp32`, `-rp2040`, `-armv7m`) this workflow called
# directly, and every hand-written "Write combined FROZEN_MANIFEST"/
# toolchain-install step around them, are gone now that the `cibuildmp`
# action itself resolves a target end to end from `micropython/cibuildmp.toml`
# -- `manifest`/`user-c-modules` there replace what those steps used to
# write out by hand (`usermod/manifests.py`'s own docstring confirms it was
# verified byte-for-byte against this file's old `cat <<EOF` bodies), and
# every port now builds inside a published cibuildmp Docker image instead
# of a bare-host toolchain install. `windows` is the biggest structural
# change: it cross-builds on a Linux runner now (no MSYS2 at build time at
# all), so building and *running* it are two different jobs -- see
# usermod-windows-build/usermod-windows-test below.
#
# Every job runs and uploads `micropython/mpyhouse/<identifier>/` --
# cibuildmp's own collected output. Not `ports/<port>/build-<identifier>/`
# inside its cache, which is cibuildmp's scratch space: running and
# shipping from there tests one file and hands the user another, which is
# exactly the shape of cibuildmp's own record 0070 (a repaired `unix`
# binary that worked in its build directory and failed from its collected
# one, because the `lib/` its rpath points at had not been collected with
# it). Collected filenames are identifier-qualified
# (`micropython-<identifier>`, `firmware-<identifier>.uf2`), so paths below
# name the identifier twice: once for the directory, once in the filename.
#
# `webassembly`'s run step is the one exception, and it is a gap in
# cibuildmp rather than a choice here: it collects one file per identifier,
# so `mpyhouse/` gets `micropython-<id>.mjs` without the
# `micropython.wasm` that file loads by name at runtime. That step still
# reads the build tree (hence CIBMP_CACHE_PATH below); its artifact is the
# collected directory like every other row's.
#
# Scope policy: this workflow only builds usermod where natmod ISN'T
# possible (no matching dynruntime.mk ARCH, or the port disables native
# code emission outright). Checked directly, port by port, against real
# MICROPY_EMIT_*/USER_C_MODULES config in the v1.28.0 tree -- not assumed.
# Not re-walked port by port against v1.29.0, where the pin now sits; what
# the policy actually turns on -- which arches natmod is possible on at all
# -- is unchanged between the two tags in cibuildmp's own
# resources/build-platforms.toml (the same ten dynruntime.mk arches, same
# mpy6.3 ABI, read off the table rather than assumed from the version bump):
#
#   - stm32 (non-tiny-flash boards), samd (M4/SAMD51), mimxrt, esp8266, nrf
#     (EXTRA_FEAT boards): natmod already works by default on the boards this
#     workflow would otherwise pick as "representative" -- usermod there
#     would just be a slower, more expensive way to test the same thing
#     natmod already covers, so it's not in this matrix at all.
#
#     unix, rp2 and esp32 used to be on that list and are not any more, each
#     for its own reason. unix x64/x86: the two build modes fail differently
#     (a usermod links against the port's own libc and lives in firmware
#     .bss; a natmod links against dynruntime), so a green natmod says
#     nothing about the usermod path on the same machine. esp32: a natmod
#     only borrows the xtensa compiler out of esp-idf, while a usermod has to
#     survive IDF's components and the port's flash/IRAM budget. rp2: the
#     strongest case of the three -- mp-natmod.yml *builds* armv6m and never
#     runs it, so before usermod-rp2040 nothing in this project had ever
#     executed on an RP2040, emulated or otherwise.
#   - webassembly: natmod is impossible (no WASM ARCH in dynruntime.mk --
#     architecturally different mechanism), but USER_C_MODULES works fine
#     (Make-based, via py/py.mk).
#   - unix on aarch64: dynruntime.mk has no aarch64 ARCH at all, so natmod
#     is impossible there too -- but unlike the cross-compile story below,
#     this needs no cross-toolchain or Docker: GitHub-hosted
#     ubuntu-24.04-arm/ubuntu-22.04-arm runners are free on public repos and
#     GA (since August 2025), so this job just builds *natively* on one, the
#     same way mp-natmod.yml's x64 job's unix build already does on
#     ubuntu-latest. hashlib.md5 is present by default here (unlike
#     webassembly's pyscript variant), so this runs the full test suite
#     (test_a7p.py/test_validate.py, load/dump included), not just
#     test_a7p_core.py.
#   - zephyr: the inverse case -- natmod is plausible on its RISC-V boards
#     (rv32m1_vega_ri5cy sets the Kconfig flags MICROPY_EMIT_RV32 needs),
#     but zephyr has no USER_C_MODULES support at all, so usermod is simply
#     not an option there. Not yet added to either job (unverified against
#     a real build); noted here so the gap isn't silently assumed away.
#   - windows: the windows port's own mpconfigport.h disables native emit
#     outright regardless of host arch, so usermod is the only option. All
#     three arches (`x86`/`x64`/`arm64`) now cross-build in one Docker image
#     on a Linux runner (cibuildmp's own `windows` usermod driver -- llvm-mingw
#     for `arm64`, apt-installed mingw-w64 gcc for `x86`/`x64`, no MSYS2
#     involved at build time at all). *Running* a Windows PE binary still
#     needs a real Windows host, so usermod-windows-test downloads each
#     build's own .exe and runs it natively -- `x86`/`x64` on windows-latest
#     (a real x64 box, WOW64 covers the 32-bit case), `arm64` on
#     windows-11-arm.
#   - unix on armhf/mipsel: also usermod-only (no matching dynruntime.mk
#     ARCH). Both are their own dedicated job (usermod-cross). armhf runs on
#     ubuntu-24.04-arm's own CPU (measured, not assumed -- AArch32 at EL0 on
#     a real arm64 host); mipsel is still emulated, cross-built from the same
#     amd64 image cibuildmp's own unix driver uses for every native-nowhere
#     unix cell.
#   - cc3200 (deprecated hardware, native emit off by default), bare-arm/
#     minimal (demo configs, not real boards), pic16bit/powerpc (different
#     CPU families entirely, no matching natmod ARCH, explicitly disabled
#     in mpconfigport.h), alif/renesas-ra (native emit on, ARCH-compatible
#     in principle, unverified against a real build), qemu (not a
#     distributable target -- see below): stay out of this workflow to keep
#     its cost proportionate to this project's realistic deployment
#     targets. embed isn't a standalone port at all (no Makefile/CMakeLists
#     of its own) and zephyr's ARM boards don't wire up native emit either.
#
# qemu deserves its own callout: it's the one place bclibc's own CI does
# something we don't -- an actual functional run under QEMU (build *and*
# execute), not just a build-check. Worth adding later as a genuine
# functional test, distinct from this scope policy (it's not a deployment
# target, so it doesn't fit the "where's natmod possible" framing above).
#
# The remaining usermod build also freezes micropython/src/a7p.py into the
# firmware image via a combined FROZEN_MANIFEST (this port's own default
# manifest + micropython/usermod/manifest.py, now generated by cibuildmp
# itself from `micropython/cibuildmp.toml`'s own `manifest` key) -- so
# `import a7p` works right after flashing/loading with no separate file
# copy, on top of USER_C_MODULES compiling the `_a7p` C half straight into
# the same image.
#
# This workflow is intentionally NOT part of release.yml (no workflow_call
# trigger) -- unlike mp-natmod.yml, none of what it builds (full interpreter/
# firmware images) is a distributable release artifact; it exists purely to
# verify this module still builds/runs on the ports natmod can't reach.

on:
  push:
    paths:
      - "micropython/**"
      - ".github/workflows/mp-usermod.yml"
  pull_request:
    paths:
      - "micropython/**"
      - ".github/workflows/mp-usermod.yml"
  workflow_dispatch:

concurrency:
  group: usermod-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned MicroPython release, not master, so this doesn't flake on
  # upstream churn -- bump deliberately, re-running the whole matrix.
  MPY_REF: v1.29.0
  # cibuildmp resolves/caches its own MicroPython checkout under this path
  # (CIBMP_CACHE_PATH -- src/cibuildmp/sources.py's own cache_root()), one
  # job-workspace-relative directory per run rather than the default
  # ~/.cache/cibuildmp: every job below needs to find the exact build tree
  # cibuildmp itself produced (mpy_dir/ports/<port>/build-<identifier>/...),
  # and a fixed, known root is what makes that path computable without
  # cibuildmp exposing it as an action output. No leading dot -- the same
  # reason cibuildmp's own test-platforms.yml names its report path
  # `cibmp-report` rather than `.cibmp-report`: actions/upload-artifact
  # defaults `include-hidden-files` to false, silently excluding anything
  # under a dot-prefixed directory (see [0065]'s own fourth addendum).
  CIBMP_CACHE_PATH: ${{ github.workspace }}/cibmp-cache

jobs:
  # ── usermod: native ports (unix x64/x86/aarch64, webassembly) ──────────────
  #
  # One job, one runner per matrix leg -- each leg builds and (except esp32/
  # rp2/qemu, their own jobs below) immediately runs its own output on the
  # same runner. `windows` used to share this job too; it is its own
  # build+test pair below now that building it no longer needs a Windows
  # runner at all.
  usermod:
    name: usermod (${{ matrix.port }}-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: webassembly
            arch_label: wasm
            identifier: v1.29.0-wasm32
            runs_on: ubuntu-latest
          - port: unix
            arch_label: x64
            identifier: v1.29.0-manylinux_2_28_x86_64
            runs_on: ubuntu-latest
          - port: unix
            arch_label: x86
            identifier: v1.29.0-manylinux_2_28_i686
            runs_on: ubuntu-latest
          - port: unix
            arch_label: aarch64
            # GitHub-hosted ubuntu-24.04-arm runners are free on public
            # repos and GA -- a native aarch64 build and run, no
            # cross-compiler, Docker emulation or QEMU needed. cibuildmp's
            # own `manylinux_2_28_aarch64` image is native to this runner
            # (record 0043), same as every other row here is native to
            # its own.
            identifier: v1.29.0-manylinux_2_28_aarch64
            runs_on: ubuntu-24.04-arm
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      # cibuildmp installs no emulation itself (cibuildwheel's own rule);
      # the job that wants it sets it up. Every leg here only ever builds
      # what its own runner is already native to, so this is defensive
      # rather than load-bearing -- same as cibuildmp's own build-examples.yml
      # applies it uniformly across every usermod job, native legs included.
      - uses: docker/setup-qemu-action@v4

      - name: Fetch nanopb
        # usermod's own orchestrator has no per-target pre-build-command
        # (natmod's own cibuildmp.toml key doesn't reach usermod builds at
        # all), so this stays a plain caller-side step, same guard natmod's
        # own config uses -- usermod/a7p/micropython.mk fetches nanopb
        # itself too, but doing it here first means that guard is already
        # satisfied by the time the port Makefile parses.
        run: make -C micropython/natmod fetch-nanopb

      - name: Build usermod (${{ matrix.identifier }})
        uses: ballistics-lab/cibuildmp@fix/companions
        with:
          package-dir: micropython
          build: ${{ matrix.identifier }}

      - name: Run tests (${{ matrix.port }})
        # webassembly has no standalone interpreter binary to hand a .py
        # file to like every other port -- run_wasm_tests.mjs is a thin
        # Node harness around the wasm build's own JS API
        # (loadMicroPython/runPython) that runs the same three test files
        # as every other port. It used to run only test_a7p_core.py here,
        # since the pyscript variant's stock config has no hashlib.md5
        # (MICROPY_PY_SSL off) and a7p.load/dump used to need it -- fixed
        # by vendoring this module's own md5 (_a7p._md5(), src/md5.c), so
        # that's no longer a firmware-config dependency at all (see
        # README.md's "No firmware hashlib.md5 dependency" section).
        #
        # unix runs the same full suite (load/dump included), same as
        # mp-natmod.yml's x64 unix build.
        #
        # Both branches run out of `mpyhouse/` -- the collected artifact
        # this job then uploads -- never the port's own build directory.
        # The wasm branch used to read the `.mjs` straight out of
        # cibuildmp's cache, where `micropython.wasm` sits beside it, so
        # this job stayed green while the artifact it uploaded was missing
        # that file entirely and could not load at all (cibuildmp record
        # 0079; 55,234 bytes uploaded where a working pair is ~281,000).
        # Testing the thing that ships is the whole point of the path
        # below.
        run: |
          if [ "${{ matrix.port }}" = "webassembly" ]; then
            node micropython/tests/run_wasm_tests.mjs "micropython/mpyhouse/${{ matrix.identifier }}/micropython-${{ matrix.identifier }}.mjs"
          else
            BIN="micropython/mpyhouse/${{ matrix.identifier }}/micropython-${{ matrix.identifier }}"
            "$BIN" -c "import _a7p; print(_a7p._decode)"
            "$BIN" -c "import a7p; print(a7p.PAYLOAD_SIZE)"
            "$BIN" micropython/tests/test_a7p.py
            "$BIN" micropython/tests/test_validate.py
          fi

      - name: Upload build (${{ matrix.port }}-${{ matrix.arch_label }})
        uses: actions/upload-artifact@v7
        with:
          name: a7p-usermod-${{ matrix.port }}-${{ matrix.arch_label }}
          path: micropython/mpyhouse/${{ matrix.identifier }}/
          if-no-files-found: error

  # ── usermod: windows, build (Linux, cross-compiled) ─────────────────────────
  #
  # All three arches now come out of cibuildmp's own `windows` usermod
  # driver -- one Docker image, cross-compiling (`x86`/`x64` via apt's
  # mingw-w64 gcc, `arm64` via llvm-mingw), the same recipe upstream
  # MicroPython's own build-mingw CI job uses. No Windows runner, no MSYS2,
  # no hand-written combined-manifest step -- cibuildmp resolves all of that
  # from micropython/cibuildmp.toml now.
  usermod-windows-build:
    name: usermod-windows-build (${{ matrix.arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86
            identifier: v1.29.0-win32
          - arch_label: x64
            identifier: v1.29.0-win_amd64
          - arch_label: arm64
            identifier: v1.29.0-win_arm64
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - name: Fetch nanopb
        run: make -C micropython/natmod fetch-nanopb

      - name: Build usermod (${{ matrix.identifier }})
        uses: ballistics-lab/cibuildmp@fix/companions
        with:
          package-dir: micropython
          build: ${{ matrix.identifier }}

      - name: Upload build (windows-${{ matrix.arch_label }})
        uses: actions/upload-artifact@v7
        with:
          name: a7p-usermod-windows-${{ matrix.arch_label }}
          path: micropython/mpyhouse/${{ matrix.identifier }}/
          if-no-files-found: error

  # ── usermod: windows, run (real Windows hosts) ──────────────────────────────
  #
  # A cross-built PE binary still needs a real Windows host to execute --
  # x86/x64 on windows-latest (a real x64 box, WOW64 covers the 32-bit
  # case), arm64 on windows-11-arm. No MSYS2 here either: the .exe from
  # usermod-windows-build is a plain mingw/llvm-mingw binary, not linked
  # against an MSYS2 runtime, so it runs directly from PowerShell.
  usermod-windows-test:
    name: usermod-windows-test (${{ matrix.arch_label }})
    needs: usermod-windows-build
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # `identifier` here too, not just in usermod-windows-build: the
        # artifact carries cibuildmp's collected filename, which is
        # identifier-qualified (`micropython-v1.29.0-win32.exe`), not the
        # port's own bare `micropython.exe`.
        include:
          - arch_label: x86
            identifier: v1.29.0-win32
            runs_on: windows-latest
          - arch_label: x64
            identifier: v1.29.0-win_amd64
            runs_on: windows-latest
          - arch_label: arm64
            identifier: v1.29.0-win_arm64
            runs_on: windows-11-arm
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: a7p-usermod-windows-${{ matrix.arch_label }}
          path: build

      - name: Run tests (windows-${{ matrix.arch_label }})
        # A prior CI run confirmed test_a7p.py/test_validate.py failed here
        # with "AttributeError: 'module' object has no attribute 'md5'" --
        # this port's stock build has no hashlib.md5. That's no longer a
        # problem: a7p.load/dump now use the module's own vendored md5
        # (_a7p._md5(), src/md5.c) instead of hashlib, so the full suite
        # runs here same as everywhere else.
        run: |
          $exe = ".\build\micropython-${{ matrix.identifier }}.exe"
          & $exe -c "import _a7p; print(_a7p._decode)"
          & $exe -c "import a7p; print(a7p.PAYLOAD_SIZE)"
          & $exe micropython\tests\test_a7p.py
          & $exe micropython\tests\test_validate.py

  # ── usermod: unix-armhf (real AArch32), unix-mipsel (cross, via QEMU) ───────
  #
  # mipsel has no native GitHub runner and never will; cibuildmp's own unix
  # driver cross-builds it from the same amd64 base image every other
  # native-nowhere unix cell uses, and this job runs the resulting binary
  # through the runner's own qemu-user-static binfmt_misc handler.
  #
  # That handler comes from a real `apt-get install qemu-user-static`
  # below, not `docker/setup-qemu-action` (what cibuildmp's own workflows
  # use everywhere, including for building this exact `mipsel` identifier
  # in its own build-examples.yml) -- checked directly against
  # `tonistiigi/binfmt`'s own published platform list (the image that
  # action installs) rather than assumed: `["linux/amd64", "linux/arm64",
  # "linux/riscv64", "linux/ppc64le", "linux/s390x", "linux/386",
  # "linux/arm/v7", "linux/arm/v6"]` -- no MIPS entry at all, so
  # `docker/setup-qemu-action` cannot register a mipsel handler regardless
  # of how it's invoked. cibuildmp's own build-examples.yml never hits
  # this gap: its own mipsel cell cross-compiles inside a plain amd64
  # container (no target-arch emulation needed to *build* it) and its
  # "test" step is `ls -laR examples/template/mpyhouse` -- it never
  # executes the binary it just cross-built at all. This job's own
  # "Run tests" step does, which `apt`'s real `qemu-user-static` package
  # covers (it ships `qemu-mipsel-static` and registers it via
  # `update-binfmts`, a broader set than `tonistiigi/binfmt`'s
  # Docker-oriented one) and `docker/setup-qemu-action` structurally
  # cannot, on any host, container-scoped registration or not.
  #
  # armhf's own row needed a different fix, not qemu: record 0043 moved it
  # off the old static cross-build (`MICROPY_STANDALONE=1
  # LDFLAGS_EXTRA=-static`) onto `manylinux_2_31_armv7l`'s native,
  # dynamically-linked toolchain, and the bare `ubuntu-24.04-arm` runner
  # ships no armhf multiarch userspace at all -- no `/lib/ld-linux-
  # armhf.so.3` outside a container. cibuildmp's own record 0044 (its
  # "armv7l bet paid off" addendum) already answers the one real question
  # this raises, though: is the CPU itself even capable of AArch32 at EL0,
  # or would this need qemu-user regardless of what's installed?  That
  # addendum measured a `manylinux_2_31_armv7l` build completing in 59.5s
  # -- *faster* than the native aarch64 build on the same runner class,
  # which only a real (non-emulated) AArch32 execution explains -- so the
  # answer is yes, GitHub's own `ubuntu-24.04-arm` parts do. What's
  # missing is purely the host's own 32-bit ARM userspace, not kernel or
  # CPU support, hence `dpkg --add-architecture armhf` below rather than
  # any qemu step. `mp-natmod.yml`'s own `natmod-arm-linux` job already
  # relies on the identical AArch32-at-EL0 capability, on a statically
  # linked binary that needs no such userspace at all.
  usermod-cross:
    name: usermod (unix-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: armhf
            identifier: v1.29.0-manylinux_2_31_armv7l
            runs_on: ubuntu-24.04-arm
          - arch_label: mipsel
            identifier: v1.29.0-manylinux_2_39_mipsel
            runs_on: ubuntu-latest
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      - name: Install qemu-user-static
        if: matrix.arch_label == 'mipsel'
        # Real host binaries and a real update-binfmts registration --
        # see this job's own header comment for why docker/setup-qemu-action
        # doesn't reach the "Run tests" step's own plain host exec.
        # armhf-only below: the manylinux_2_31_armv7l build container runs
        # natively on this CPU (cibuildmp's own record 0044 measured
        # 59.5s, faster than the native aarch64 build on the same runner
        # class -- not an emulation-speed number), so there is nothing
        # here for qemu to do on that leg at all.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Install armhf multiarch userspace
        if: matrix.arch_label == 'armhf'
        # The missing piece per this job's own header comment: the CPU
        # already executes AArch32 natively (record 0044), but the bare
        # runner filesystem carries no 32-bit ARM userspace at all outside
        # a container -- no /lib/ld-linux-armhf.so.3, dynamic or not.
        # libc6:armhf alone is enough: it provides the loader itself plus
        # libc/libm/libpthread, and repair_unix_binary() (cibuildmp) has
        # already vendored libffi.so.7 into a lib/ directory beside the
        # binary with a matching $ORIGIN rpath, so once the loader exists
        # at all it resolves that on its own -- nothing armhf-specific
        # needed for libffi here.
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libc6:armhf

      - name: Fetch nanopb
        run: make -C micropython/natmod fetch-nanopb

      - name: Build usermod (${{ matrix.identifier }})
        uses: ballistics-lab/cibuildmp@fix/companions
        with:
          package-dir: micropython
          build: ${{ matrix.identifier }}

      - name: Run tests (${{ matrix.arch_label }})
        # No explicit qemu-<arch> prefix in either case, but for two
        # different reasons: on mipsel qemu-user-static registers a
        # binfmt_misc handler and the cross-compiled binary runs through it;
        # on armhf there is no emulator involved at all and the arm64
        # runner executes the 32-bit binary itself. `file` is printed first
        # so the log records which of the two actually happened.
        run: |
          BIN="micropython/mpyhouse/${{ matrix.identifier }}/micropython-${{ matrix.identifier }}"
          file "$BIN"
          "$BIN" -c "import _a7p; print(_a7p._decode)"
          "$BIN" -c "import a7p; print(a7p.PAYLOAD_SIZE)"
          "$BIN" micropython/tests/test_a7p.py
          "$BIN" micropython/tests/test_validate.py

      - name: Upload build (unix-${{ matrix.arch_label }})
        uses: actions/upload-artifact@v7
        with:
          name: a7p-usermod-unix-${{ matrix.arch_label }}
          path: micropython/mpyhouse/${{ matrix.identifier }}/
          if-no-files-found: error

  # ── usermod: armv7m on bare-metal QEMU (Cortex-M3) ──────────────────────────
  #
  # The one target in this workflow that is neither a desktop OS nor an
  # emulated Linux: real firmware for a Cortex-M3, run under
  # qemu-system-arm. It is a genuine functional execution test on a
  # bare-metal target, which nothing else here provides -- natmod's own
  # armv7m coverage is a build check.
  #
  # Scope note: unlike every other row, natmod *can* reach armv7m, so this
  # duplicates an ARCH rather than filling a gap. It earns its place anyway,
  # because it exercises something the natmod build cannot: ports/qemu links
  # -nostdlib with only libgcc, so a usermod here has no libc and no libm at
  # all. This module needs neither -- it has no malloc, no math, no printf --
  # and that is worth holding true rather than assuming. A module that did
  # would fail to link here, which is exactly the signal wanted.
  # micropython-bclibc runs the same job for the same reason.
  #
  # Only test_a7p_core.py: the port has no filesystem, and while the fixture
  # can be pushed in read-only (see micropython/ci/run_qemu.py), test_a7p.py
  # also *writes* a roundtrip file, which would need a writable VFS. Both
  # full suites run on every other target.
  usermod-qemu-armv7m:
    name: usermod (qemu-armv7m)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          pip install pyserial

      - name: Fetch nanopb
        run: make -C micropython/natmod fetch-nanopb

      - name: Build usermod (v1.29.0-qemu-MPS2_AN385)
        uses: ballistics-lab/cibuildmp@fix/companions
        with:
          package-dir: micropython
          build: v1.29.0-qemu-MPS2_AN385

      - name: Run tests via QEMU
        # micropython/ci/run_qemu.py reads MPY_DIR to find tools/pyboard.py
        # (falling back to a local ./mpy that this workflow never creates,
        # since it relies on cibuildmp's own MPY_DIR-independent cache
        # instead of clone-micropython/fetch-micropython -- unlike main's
        # own equivalent job, which set MPY_DIR via fetch-micropython for
        # this exact reason). cibuildmp's own cache already holds a full
        # checkout at this path, tools/ included, so pointing MPY_DIR at
        # it directly needs no extra checkout step.
        env:
          MPY_DIR: ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_REF }}
        run: |
          python3 micropython/ci/run_qemu.py \
            "micropython/mpyhouse/v1.29.0-qemu-MPS2_AN385/firmware-v1.29.0-qemu-MPS2_AN385.elf"

      - name: Upload build (qemu-armv7m)
        uses: actions/upload-artifact@v7
        with:
          name: a7p-usermod-qemu-armv7m
          path: micropython/mpyhouse/v1.29.0-qemu-MPS2_AN385/
          if-no-files-found: error

  # ── usermod: ESP32, build-only ──────────────────────────────────────────────
  #
  # Build-only, and not as a shortcut: there is no esp32 emulator to hand a
  # firmware image to the way rp2040py takes an RP2040 .uf2 or qemu-system-arm
  # takes a Cortex-M3 .elf. What this proves is that this module compiles and
  # links into a real esp32 firmware under the ESP-IDF toolchain -- a
  # different compiler, libc and config from everything else in this workflow.
  # It does not prove anything runs.
  #
  # cibuildmp's own esp32 driver resolves idf_version/idf_target from
  # resources/build-platforms.toml itself -- v5.5.2 for
  # v1.29.0-ESP32_GENERIC, moved there by the tag bump alone (it was v5.5.1
  # under v1.28.0, matching what this job used to hardcode back when it
  # installed ESP-IDF itself) -- clones ESP-IDF on the host and
  # runs the actual build inside its own Docker image -- no separate
  # ESP-IDF-install step needed here any more.
  #
  # esp32's build tree keys on its own board, not the full identifier
  # (Esp32BuildOptions carries no build_dir of its own -- the port's own
  # ESP-IDF-driven build-$(BOARD) default is used unmodified), unlike every
  # other port in this workflow.
  usermod-esp32:
    name: usermod (esp32 / ESP32_GENERIC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      - name: Fetch nanopb
        run: make -C micropython/natmod fetch-nanopb

      - name: Build usermod (v1.29.0-esp32-ESP32_GENERIC)
        uses: ballistics-lab/cibuildmp@fix/companions
        with:
          package-dir: micropython
          build: v1.29.0-esp32-ESP32_GENERIC

      - name: Upload build (esp32)
        uses: actions/upload-artifact@v7
        with:
          name: a7p-usermod-esp32
          path: micropython/mpyhouse/v1.29.0-esp32-ESP32_GENERIC/
          if-no-files-found: error

  # ── usermod: RP2040, build + run under the rp2040py emulator ────────────────
  #
  # The natmod-first policy at the top of this file lists rp2 among the ports
  # where "usermod would just be a slower way to test what natmod already
  # covers". That was true when natmod's rp2 ARCHes were the only coverage
  # this project had of them -- but mp-natmod.yml *builds* armv6m and never
  # runs it. Nothing in this project has ever executed on an RP2040, emulated
  # or otherwise, which makes this the one exception to that policy that adds
  # execution rather than another build.
  #
  # micropython/ci/run_rp2040py.py drives it. rp2040py's `micropython <file>`
  # mode pushes a script over the raw REPL and runs it in place, so the module
  # itself needs nothing (a usermod is already in the firmware) -- but the
  # fixture does, and it cannot ride along as a file: `rp2040py mklittlefs`
  # accepts only .py/.mpy/.js, so a .a7p blob has no way into the image. Same
  # answer as the qemu job: inline it and shadow open() for that one path.
  #
  # test_a7p_core.py only, matching the qemu job -- test_a7p.py also *writes*
  # a roundtrip file. That would actually work here, unlike on ports/qemu
  # (rp2 has a real littlefs), but the point of this job is the execution
  # environment rather than the suite, and both full suites run on every
  # desktop target.
  #
  # rp2's own build tree keys on its board, not the full identifier
  # (Rp2BuildOptions carries no build_dir of its own, same as esp32 above) --
  # build-RPI_PICO, the port's own unmodified default.
  usermod-rp2040:
    name: usermod (rp2040 / RPI_PICO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout a7p
        uses: actions/checkout@v7

      - name: Fetch nanopb
        run: make -C micropython/natmod fetch-nanopb

      - name: Build usermod (v1.29.0-rp2-RPI_PICO)
        uses: ballistics-lab/cibuildmp@fix/companions
        with:
          package-dir: micropython
          build: v1.29.0-rp2-RPI_PICO

      - uses: o-murphy/rp2040py/.github/actions/setup-rp2040py@v0.3.1
        with:
          version: "0.3.1"

      - name: Run test_a7p_core.py on the emulated RP2040
        run: |
          python3 micropython/ci/run_rp2040py.py \
            "micropython/mpyhouse/v1.29.0-rp2-RPI_PICO/firmware-v1.29.0-rp2-RPI_PICO.uf2"

      - name: Upload build (rp2040)
        uses: actions/upload-artifact@v7
        with:
          name: a7p-usermod-rp2040
          path: micropython/mpyhouse/v1.29.0-rp2-RPI_PICO/
          if-no-files-found: error
