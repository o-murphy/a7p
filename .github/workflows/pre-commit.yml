name: Pre-commit

# Runs the same .pre-commit-config.yaml hooks devs run locally (see
# README.md's "Pre-commit hooks" section) against the whole repo, so a
# contributor who skipped `pre-commit install` still gets caught in CI.
# All hooks are `language: system` (they shell out to each package's own
# toolchain -- uv/ruff/mypy/pytest, yarn/prettier/tsc/jest, dart, go, plus
# protoc/protoc-gen-go for the schema/proto drift guard -- rather than a
# toolchain pre-commit itself manages), so every one of those has to be
# installed here first or its hook just fails with "command not found".
# Required leg of release.yml's release gate (see test-pre-commit there):
# several per-package CI steps were folded into hooks here instead of
# staying duplicated in py.yml/js.yml/dart.yml/go.yml (py.yml and js.yml
# were deleted outright once nothing non-redundant was left in them).

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-commit:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: js/yarn.lock

      # No explicit "yarn install"/"dart pub get" steps here -- the
      # yarn-install/dart-pub-get hooks (first in each package's section of
      # .pre-commit-config.yaml) do that as part of the run below, same as
      # a dev running `pre-commit run` locally would rely on.
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: stable

      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.5"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        # Pinned to go.mod's google.golang.org/protobuf version (not @latest) so
        # the generated file's "// protoc-gen-go vX.Y.Z" version comment always
        # matches what's committed -- otherwise the drift guard hook fails on
        # every protoc-gen-go release even when nothing else changed.
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit
        id: first_run
        continue-on-error: true
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          pre-commit run --all-files --show-diff-on-failure

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail (no auto-fixable changes, but hooks failed)
        if: steps.diff.outputs.changed == 'false' && steps.first_run.outcome == 'failure'
        run: exit 1

      - name: Fail (changes produced, but not on a pull_request)
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          echo "pre-commit modified files, but auto-commit only runs on pull_request events."
          exit 1

      - name: Re-run pre-commit after auto-fixes
        id: verify_run
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          pre-commit run --all-files --show-diff-on-failure

      - name: Fail (issues remain after auto-fix)
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request' && steps.verify_run.outcome == 'failure'
        run: exit 1

      - name: Commit and push auto-fixes
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request' && steps.verify_run.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-fix via pre-commit"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
